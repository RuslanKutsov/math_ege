}

/* Альтернатива загрузке файла: вставить прямую ссылку на уже где-то
   размещённую картинку. Хранится тогда только сама строка-URL (десятки
   байт), а не base64 картинки (сотни КБ – единицы МБ) — критично важно,
   когда общий объём хранилища артефакта (лимит ~20 МБ на весь артефакт,
   не на параграф) уже близок к исчерпанию. Ссылка просто добавляется в
   тот же массив images/wideImages, что и base64-картинки — рендер условия
   их не различает (<img src="...">), так что можно свободно мешать оба
   способа в одной задаче. */
function isLikelyImageUrl(u){ return /^https?:\/\/\S+$/i.test((u||'').trim()); }

async function addImageUrlToDraft(key, field, inputId){
  const el = document.getElementById(inputId);
  if(!el) return;
  const url = el.value.trim();
  if(!url) return;
  if(!isLikelyImageUrl(url)){ await customAlert('Похоже на некорректную ссылку — она должна начинаться с http:// или https:// и указывать прямо на файл картинки.'); return; }
  if(!teacherDrafts[key]) teacherDrafts[key] = {text:'',answer:'',images:[],wideImages:[]};
  if(!teacherDrafts[key][field]) teacherDrafts[key][field] = [];
  teacherDrafts[key][field].push(url);
  el.value = '';
  refreshDraftUI(key, field);
}

function urlAddRowHtml(key, field){
  const inputId = 'url-input-' + key + '-' + field;
  return `<div style="display:flex; gap:6px; margin-top:6px;">
    <input type="text" id="${inputId}" placeholder="или вставьте прямую ссылку на картинку (https://...) — почти не расходует лимит хранилища" onkeydown="if(event.key==='Enter'){event.preventDefault();addImageUrlToDraft('${key}','${field}','${inputId}');}">
    <button type="button" class="btn btn-sm" onclick="addImageUrlToDraft('${key}','${field}','${inputId}')">Добавить по ссылке</button>
  </div>`;
}

function imgGalleryHtml(key, field){
  field = field || 'images';
  const d = teacherDrafts[key];
  if(!d || !d[field] || !d[field].length) return '';
  return `<div class="img-gallery" style="margin-top:0;">
    ${d[field].map((src,i)=>`
      <div class="img-thumb-wrap">
        <img class="img-thumb" src="${src}">
        <div class="img-thumb-remove" onclick="removeImageFromDraft('${key}',${i},'${field}')">✕</div>
      </div>`).join('')}
  </div>`;
}

function fileToDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* Сжатие картинки перед сохранением в хранилище: скриншоты задач из PDF часто
   весят по несколько МБ каждый (высокое разрешение исходного скана), а один
   файл хранилища физически хранит ВСЕ картинки ВСЕХ задач параграфа сразу
   (лимит 5 МБ на ключ) — без сжатия параграф с 3-5 задачами и парой картинок
   в каждой легко упрётся в лимит. Поэтому картинка перерисовывается на canvas
   с уменьшением до maxDim по большей стороне и пересохраняется как JPEG с
   заданным качеством — для сканов текста/формул это почти не заметно на глаз,
   а вес обычно падает в 5-15 раз. Если что-то пошло не так (canvas недоступен,
   ошибка декодирования) — используется исходный файл как есть, ничего не теряется. */
function compressImageFile(file, maxDim, quality){
  maxDim = maxDim || 1500;
  quality = quality || 0.82;
  return new Promise(resolve=>{
    if(!file || !file.type || !file.type.startsWith('image/')){
      fileToDataURL(file).then(resolve).catch(()=>resolve(null));
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ resolve(reader.result); return; }
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        try{
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; // фон под прозрачность PNG — при JPEG прозрачности всё равно нет
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const jpegUrl = canvas.toDataURL('image/jpeg', quality);
          // подстраховка: если пересжатая версия почему-то оказалась тяжелее исходника
          // (бывает с уже маленькими/простыми картинками) — берём то, что легче
          resolve(jpegUrl.length < reader.result.length ? jpegUrl : reader.result);
        }catch(e){
          resolve(reader.result);
        }
      };
      img.onerror = ()=>resolve(reader.result);
      img.src = reader.result;
    };
    reader.onerror = ()=>resolve(null);
    reader.readAsDataURL(file);
  });
}

/* То же сжатие, что и compressImageFile, но для картинки, УЖЕ хранящейся как
   base64 data-URL (не File) — используется для "пересжатия" уже сохранённых
   картинок параграфа, в частности тех, что попали через импорт JSON и не
   проходили через компрессию (импортированные файлы могут быть исходными
   сканами в несколько МБ каждый). */
function compressDataUrl(dataUrl, maxDim, quality){
  maxDim = maxDim || 1500;
  quality = quality || 0.78;
  return new Promise(resolve=>{
    if(!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ resolve(dataUrl); return; }
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      try{
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const jpegUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(jpegUrl.length < dataUrl.length ? jpegUrl : dataUrl);
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function recompressImagesArray(arr, maxDim){
  const out = [];
  for(const src of (arr||[])) out.push(await compressDataUrl(src, maxDim, 0.78));
  return out;
}


async function addImageBlobsToDraft(key, blobs, field){
  field = field || 'images';
  if(!teacherDrafts[key]) teacherDrafts[key] = {text:'',answer:'',images:[],wideImages:[]};
  if(!teacherDrafts[key][field]) teacherDrafts[key][field] = [];
  // "Картинка на всю ширину" обычно содержит больше мелких деталей/текста
  // (схемы, таблицы, целые страницы) — оставляем ей чуть больший размер,
  // чем узкой колонке "images" слева от текста.
  const maxDim = field === 'wideImages' ? 1700 : 1100;
  for(const b of blobs){
    try{ const url = await compressImageFile(b, maxDim, 0.82); if(url) teacherDrafts[key][field].push(url); }
    catch(e){}
  }
  refreshDraftUI(key, field);
}

async function addImagesToDraft(key, evt, field){
  const files = Array.from(evt.target.files || []);
  evt.target.value = '';
  await addImageBlobsToDraft(key, files, field);
}

/* Единый трекер «где сейчас работает пользователь с картинками» — обновляется
   и по клику (capture-фаза, срабатывает даже на некликабельных div/label —
   именно там раньше был баг: клик по подписи/галерее НЕ меняет document.activeElement,
   старый фокус в другом поле оставался «главным» и побеждал новый клик), и по
   реальному фокусу (focusin — например при переходе по Tab). Кто сработал позже —
   тот и прав, отдельно проверять document.activeElement в момент paste не нужно. */
let lastImgKey = null, lastImgField = null;
function trackImgTarget(el){
  const keyEl = el.closest && el.closest('[data-imgkey]');
  if(!keyEl) return;
  const fieldEl = el.closest && el.closest('[data-imgfield]');
  lastImgKey = keyEl.getAttribute('data-imgkey');
  lastImgField = fieldEl ? fieldEl.getAttribute('data-imgfield') : null;
}
document.addEventListener('click', (e)=>trackImgTarget(e.target), true);
document.addEventListener('focusin', (e)=>trackImgTarget(e.target));

/* Вставка картинки из буфера обмена (Ctrl+V) прямо в нужное поле —
   «Изображения условия» (слева) или «Картинка на всю ширину» (внизу задачи).
   Источник истины — lastImgKey/lastImgField (см. trackImgTarget выше). Если
   пользователь ещё никуда не кликал — ничего не вставляем (не угадываем),
   чтобы не промахнуться мимо задачи. */
document.addEventListener('paste', async (e)=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  const imageItems = Array.from(items).filter(it => it.kind === 'file' && it.type && it.type.startsWith('image/'));
  if(!imageItems.length) return;
  if(!lastImgKey) return; // не найдено надёжного адресата

  e.preventDefault();
  const key = lastImgKey;
  const field = lastImgField || 'images';
  const blobs = imageItems.map(it=>it.getAsFile()).filter(Boolean);
  await addImageBlobsToDraft(key, blobs, field);
});

function removeImageFromDraft(key, idx, field){
  field = field || 'images';
  teacherDrafts[key][field].splice(idx,1);
  refreshDraftUI(key, field);
}

/* Перед любой перерисовкой строки (добавление картинки, переключение
   галочки «есть доп. задача») подтягиваем из DOM в teacherDrafts всё, что
   пользователь мог успеть напечатать — иначе innerHTML-перерисовка это сотрёт. */
function syncFollowUpInputs(key){
  const d = teacherDrafts[key];
  if(!d) return;
  const cb = document.getElementById('fu-check-'+key);
  const ft = document.getElementById('fu-text-'+key);
  const fa = document.getElementById('fu-answer-'+key);
  const fs = document.getElementById('fu-solution-'+key);
  if(cb) d.hasFollowUp = cb.checked;
  if(ft) d.fuText = ft.value;
  if(fa) d.fuAnswer = fa.value;
  if(fs) d.fuSolutionText = fs.value;
}

function toggleFollowUp(key){
  refreshDraftUI(key, null);
}

function syncNewMainInputs(){
  const d = teacherDrafts['new'];
  if(!d) return;
  const t = document.getElementById('new-text');
  const a = document.getElementById('new-answer');
  const s = document.getElementById('new-solution');
  if(t) d.text = t.value;
  if(a) d.answer = a.value;
  if(s) d.solutionText = s.value;
}

function refreshDraftUI(key, field){
  lastImgKey = key;
  lastImgField = field || null;
  if(key === 'new'){
    syncNewMainInputs();
    syncFollowUpInputs('new');
    drawProblemsTab();
    refocusImgField(document.getElementById('add-form'), field);
    return;
  }
  const [par, num] = key.split('-').map(Number);
  const row = document.getElementById('row-'+key);
  if(row){
    const t = document.getElementById('text-'+key), a = document.getElementById('answer-'+key), s = document.getElementById('solution-'+key);
    if(t) teacherDrafts[key].text = t.value;
    if(a) teacherDrafts[key].answer = a.value;
    if(s) teacherDrafts[key].solutionText = s.value;
    syncFollowUpInputs(key);
    row.outerHTML = problemEditRow(par, num);
    refocusImgField(document.getElementById('row-'+key), field);
  }
}

/* После перерисовки строки браузер сбрасывает фокус на <body>. Возвращаем фокус
   на файловый input внутри того же блока картинок, чтобы следующая вставка
   Ctrl+V без лишнего клика попала туда же (а не потерялась/промахнулась). */
function refocusImgField(scopeEl, field){
  if(!scopeEl || !field) return;
  const target = scopeEl.querySelector(`[data-imgfield="${field}"] input[type="file"]`);
  if(target) target.focus({preventScroll:true});
}

/* ---------- Панель формул: степени, индексы, корень и другие символы ---------- */
function insertAtCursor(id, str){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + str.length;
  el.focus();
  el.setSelectionRange(pos, pos);
}

const FORMULA_BUTTONS = [
  ['x²','²'],
  ['a\u20D7','\u20D7'],
  ['α','α'],['β','β'],['γ','γ'],['φ','φ'],['ω','ω'],['η','η'],['ν','ν'],['τ','τ'],['μ','μ'],['ℰ','ℰ'],
  ['π','π'],['Δ','Δ'],['·','·'],['×','×'],['÷','÷'],['−','−'],['±','±'],['°','°'],['≈','≈'],['≤','≤'],['≥','≥'],['∈','∈'],['→','→'],
  ['∪','∪'],['ℤ','ℤ'],['ℕ','ℕ'],['∞','∞']
];

/* Оборачивает выделенный текст в prefix{...}, либо, если ничего не выделено,
   вставляет шаблон с курсором внутри скобок. Общая логика для √{}, ^{} и _{}. */
function insertWrapTemplate(id, prefix){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = prefix + '{' + selected + '}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = selected ? (start + str.length) : (start + prefix.length + 1);
  el.focus();
  el.setSelectionRange(pos, pos);
}
function insertSqrtTemplate(id){ insertWrapTemplate(id, '√'); }
function insertOverlineTemplate(id){ insertWrapTemplate(id, '#'); }
function insertSupTemplate(id){ insertWrapTemplate(id, '^'); }
function insertSubTemplate(id){ insertWrapTemplate(id, '_'); }
function insertBoldTemplate(id){ insertWrapTemplate(id, '*'); }
function insertItalicTemplate(id){ insertWrapTemplate(id, '%'); }
function insertUprightTemplate(id){ insertWrapTemplate(id, '!'); }

/* Дробь с горизонтальной чертой: /{числитель}{знаменатель}.
   Если выделен текст — он становится числителем, курсор переходит в пустой знаменатель. */
function insertFracTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = '/{' + selected + '}{}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + 2 + selected.length + 2; // курсор внутри знаменателя
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Круглые/квадратные скобки, которые сами растягиваются по высоте, если
   внутри окажется дробь (/{}{}) — см. formatMath()/.bracket-tall в CSS.
   Если выделен текст — он оборачивается скобками, курсор ставится сразу
   после результата; если ничего не выделено — вставляется пустой шаблон
   с курсором внутри скобок. Если в выделение случайно попала уже
   "нарисованная" обычная скобка того же типа на границе (например,
   выделили "x − π/4)" вместе с закрывающей скобкой) — она срезается,
   иначе после оборачивания получался бы заметный дубль: обычная скобка
   из текста плюс новая растягивающаяся скобка сразу за ней. */
function insertBracketTemplate(id, open, close){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  let selected = el.value.slice(start, end);
  if(selected.startsWith(open)) selected = selected.slice(1);
  if(selected.endsWith(close)) selected = selected.slice(0, -1);
  const str = open + '{' + selected + '}' + close;
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = selected ? (start + str.length) : (start + open.length + 1);
  el.focus();
  el.setSelectionRange(pos, pos);
}
function insertParenTemplate(id){ insertBracketTemplate(id, '(', ')'); }
function insertSquareBracketTemplate(id){ insertBracketTemplate(id, '[', ']'); }

/* Корень произвольной степени: ^{n}√{выражение} — верхний индекс со степенью
   корня сразу перед знаком корня (см. formatMath: ^{} даёт <sup>, а следующий
   за ним √{} — обычный радикал; вместе они читаются как ⁿ√). Если выделен
   текст — он становится подкоренным выражением, а курсор ставится в пустые
   скобки степени, чтобы сразу вписать показатель (например «3» для кубического
   корня). */
function insertNthRootTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  const selected = el.value.slice(start, end);
  const str = '^{}√{' + selected + '}';
  el.value = el.value.slice(0, start) + str + el.value.slice(end);
  const pos = start + 2; // курсор внутри ^{} — сюда вписывается степень корня
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Система уравнений/неравенств (аналог LaTeX \begin{cases}) — вставляет
   блок [sys]...[/sys] с двумя пустыми строками-уравнениями; учитель дописывает
   нужное количество строк, скобка слева растягивается автоматически на любое
   их число (см. formatMathText/sysBraceSvg). Без переноса строки СРАЗУ после
   [/sys] — иначе этот символ остаётся обычным текстом сразу за блоком и
   smartWrap() принимает его за начало нового абзаца (пустая строка перед
   следующим текстом), даже если учитель печатает дальше без нажатия Enter. */
function insertSysTemplate(id){
  insertAtCursor(id, '\n[sys]\n\n\n[/sys]');
}

/* Запись вида «ядерная физика»: массовое и зарядовое число друг над другом слева от символа: ~{A}{Z}. */
function insertNuclideTemplate(id){
  const el = document.getElementById(id);
  if(!el) return;
  const start = el.selectionStart != null ? el.selectionStart : el.value.length;
  const end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + '~{}{}' + el.value.slice(end);
  const pos = start + 2; // курсор внутри первых скобок (массовое число)
  el.focus();
  el.setSelectionRange(pos, pos);
}

/* Вставляет шаблон небольшой таблицы 2×2 — строки данных, столбцы через | ; учитель дописывает по образцу. */
function insertTableTemplate(id){
  insertAtCursor(id, '\n[table]\n |  | \n |  | \n[/table]\n');
}

/* Вставляет шаблон "[cols]...[/cols]" — часть текста внутри выводится в 2
   колонки (например, длинный список вариантов ответа 1)/2)/3)/4)). Каждая
   строка внутри — отдельный пункт колонки. */
function insertColsTemplate(id){
  insertAtCursor(id, '\n[cols]\n1) \n2) \n3) \n4) \n[/cols]\n');
}

/* Принудительный перенос на новую строку — БЕЗ пустой строки-отступа перед ним.
   smartWrap() автоматически сворачивает обычные одиночные переносы строк (Enter)
   в пробел (это нужно, чтобы убирать вынужденные переносы вёрстки исходного PDF),
   и сохраняет разрыв только если строка целиком пустая (настоящий абзац) или
   совпадает с одним из известных паттернов (варианты ответа, "Ответ:" и т.п.).
   Обычный одиночный \n тут не подходит — он был бы молча склеен обратно. Поэтому
   после \n вставляется невидимый маркер PARAGRAPH_BREAK_MARKER (см. выше, у
   formatMath) — smartWrap() распознаёт его как "здесь точно нужен перенос" и
   вырезает перед выводом, так что в итоге получается просто перенос строки
   без визуального пустого промежутка. */
function insertParagraphBreak(id){
  insertAtCursor(id, '\n' + PARAGRAPH_BREAK_MARKER);
}

function formulaToolbarHtml(textareaId){
  const plain = FORMULA_BUTTONS.map(([label,val])=>

  return `<div class="formula-toolbar">${plain}${sqrtBtn}${nthRootBtn}${supBtn}${subBtn}${fracBtn}${parenBtn}${squareBracketBtn}${nuclideBtn}${overlineBtn}${boldBtn}${italicBtn}${uprightBtn}${tableBtn}${colsBtn}${sysBtn}${paraBtn}</div>`;

function loadTextFileInto(inputId, evt){
  const file = evt.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{ document.getElementById(inputId).value = r.result; };
  r.readAsText(file, 'UTF-8');
  evt.target.value = '';
}

function moveTargetOptions(par, num){
  const nums = problemsForPar(par).filter(n=>n!==num);
  return nums.map(n=>`<option value="${n}" ${n===num-1?'selected':''}>После задачи ${taskLabel(par,n)}</option>`).join('');
}

async function confirmMove(key){
  const [par, num] = key.split('-').map(Number);
  const sel = document.getElementById('move-target-'+key);
  const afterNum = parseInt(sel.value, 10);
  const btn = sel.nextElementSibling;
  if(btn){ btn.disabled = true; btn.textContent = 'Переносим...'; }
  let ok = await moveProblemAfter(par, num, afterNum);
  if(!ok) ok = await handleSaveFailure(()=>moveProblemAfter(par, num, afterNum));
  moveModeKey = null;
  await renderProblemsTab();
  renderSidebar();

/* Читает из DOM все текстовые поля/ответы уже существующих задач параграфа
   (картинки не трогает — они и так живут в teacherDrafts актуально, без
   привязки к кнопке "Сохранить") и переносит их в переданный blob-объект.
   Используется и кнопкой "Сохранить все", и добавлением/вставкой новой
   задачи — чтобы несохранённые правки в старых задачах не терялись. */
function syncParBlobFromDOM(par, blob){
  problemsForPar(par).forEach(n=>{
    const key = pKey(par, n);
    const textEl = document.getElementById('text-'+key);
    const answerEl = document.getElementById('answer-'+key);
    const solutionEl = document.getElementById('solution-'+key);
    const draft = teacherDrafts[key];
    const text = textEl ? textEl.value.trim() : (draft ? draft.text : (blob[n]&&blob[n].text)||'');
    const answer = answerEl ? answerEl.value.trim() : (draft ? draft.answer : (blob[n]&&blob[n].answer)||'');
    const solutionText = solutionEl ? solutionEl.value.trim() : (draft ? draft.solutionText : (blob[n]&&blob[n].solutionText)||'');
    const solutionImages = draft ? (draft.solutionImages||[]) : ((blob[n]&&blob[n].solutionImages)||[]);
    const images = draft ? (draft.images||[]) : ((blob[n]&&blob[n].images)||[]);
    const wideImages = draft ? (draft.wideImages||[]) : ((blob[n]&&blob[n].wideImages)||[]);

    const fuCheckEl = document.getElementById('fu-check-'+key);
    const fuTextEl = document.getElementById('fu-text-'+key);
    const fuAnswerEl = document.getElementById('fu-answer-'+key);
    const fuSolutionEl = document.getElementById('fu-solution-'+key);
    const prevFollowUp = blob[n] && blob[n].followUp;
    const hasFollowUp = fuCheckEl ? fuCheckEl.checked : (draft ? !!draft.hasFollowUp : !!prevFollowUp);
    const fuText = fuTextEl ? fuTextEl.value.trim() : (draft ? draft.fuText : (prevFollowUp && prevFollowUp.text) || '');
    const fuAnswer = fuAnswerEl ? fuAnswerEl.value.trim() : (draft ? draft.fuAnswer : (prevFollowUp && prevFollowUp.answer) || '');
    const fuSolutionText = fuSolutionEl ? fuSolutionEl.value.trim() : (draft ? draft.fuSolutionText : (prevFollowUp && prevFollowUp.solutionText) || '');
    const fuSolutionImages = draft ? (draft.fuSolutionImages||[]) : ((prevFollowUp && prevFollowUp.solutionImages) || []);
    const fuImages = draft ? (draft.fuImages||[]) : ((prevFollowUp && prevFollowUp.images) || []);
    const fuWideImages = draft ? (draft.fuWideImages||[]) : ((prevFollowUp && prevFollowUp.wideImages) || []);
    const followUp = hasFollowUp ? { text: fuText, answer: fuAnswer, solutionText: fuSolutionText, solutionImages: fuSolutionImages, images: fuImages, wideImages: fuWideImages } : undefined;

    blob[n] = { text, answer, solutionText, solutionImages, images, wideImages, followUp };
    if(draft){ draft.text = text; draft.answer = answer; draft.solutionText = solutionText; draft.solutionImages = solutionImages; draft.hasFollowUp = hasFollowUp; draft.fuText = fuText; draft.fuAnswer = fuAnswer; draft.fuSolutionText = fuSolutionText; draft.fuSolutionImages = fuSolutionImages; }
  });
}

/* Кнопка "Сохранить все изменения в параграфе" — по одному запросу на
   задачу (раньше был один общий блок, но в Supabase каждая задача — это
   отдельная строка). Считаем, что в этот момент ученики ответы не вводят
   (правки результатов не затрагиваются). */
async function saveAllProblems(){
  const par = teacherSelectedPar;
  const btn = document.getElementById('save-all-btn');

  const blob = getParBlob(par);
  syncParBlobFromDOM(par, blob);

  // Та же защита, что и в saveProblemEdit (см. пояснение там) — но по всем
  // задачам параграфа сразу, до того как что-либо реально отправлено на сервер.
  const wiped = problemsForPar(par).filter(n=>{
    const prevAk = teacherAnswerKeyCache[dbId(par, n)];
    const hadAnswerBefore = !!(prevAk && ((prevAk.answer && prevAk.answer.trim()) || (prevAk.solutionText && prevAk.solutionText.trim()) || (prevAk.solutionImages && prevAk.solutionImages.length)));
    const b = blob[n];
    const willBeEmpty = !!b && !b.answer && !(b.solutionText && b.solutionText.trim()) && !(b.solutionImages && b.solutionImages.length);
    return hadAnswerBefore && willBeEmpty;
  }).map(n=>taskLabel(par,n));
  if(wiped.length){
    const proceed = await customConfirm('Внимание: сохранение удалит ранее сохранённый эталонный ответ/решение у задач: '+wiped.join(', ')+'.\nЭто обычно означает, что поля не успели загрузиться. Всё равно сохранить всё как есть?');
    if(!proceed) return;
  }

  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  let allOk = true;
  for(const n of problemsForPar(par)){
    const ok = await saveProblem(pKey(par, n), blob[n]);
    if(!ok) allOk = false;
  }

  if(allOk) await customAlert('Все задачи параграфа сохранены');
  else await customAlert('Не всё удалось сохранить — попробуйте ещё раз.');
  await renderProblemsTab();
  renderSidebar();
}

function followUpFromForm(key){
  const cb = document.getElementById('fu-check-'+key);
  if(!cb || !cb.checked) return undefined;
  const textEl = document.getElementById('fu-text-'+key);
  const answerEl = document.getElementById('fu-answer-'+key);
  const solutionEl = document.getElementById('fu-solution-'+key);
  const d = teacherDrafts[key] || {};
  return {
    text: textEl ? textEl.value.trim() : (d.fuText||''),
    answer: answerEl ? answerEl.value.trim() : (d.fuAnswer||''),
    solutionText: solutionEl ? solutionEl.value.trim() : (d.fuSolutionText||''),
    solutionImages: d.fuSolutionImages || [],
    images: d.fuImages || [],
    wideImages: d.fuWideImages || []
  };
}

let addProblemBusy = false;

async function addProblem(btn){
  if(addProblemBusy) return; // защита от двойного клика — не шлём два запроса к хранилищу подряд
  addProblemBusy = true;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  try{
    const text = document.getElementById('new-text').value.trim();
    const answer = document.getElementById('new-answer').value.trim();
    const solutionText = document.getElementById('new-solution').value.trim();
    const solutionImages = teacherDrafts['new'].solutionImages || [];
    const images = teacherDrafts['new'].images;
    const wideImages = teacherDrafts['new'].wideImages;
    const followUp = followUpFromForm('new');
    const par = teacherSelectedPar;

    // сохраняем несохранённые правки в уже существующих задачах параграфа
    // (если они были) — иначе они потеряются при перезаписи блоба
    syncParBlobFromDOM(par, getParBlob(par));

    if(insertAfterNum !== null){
      const afterNumSnapshot = insertAfterNum;
      let ok = await insertProblemAfter(par, afterNumSnapshot, {text, answer, solutionText, solutionImages, images, wideImages, followUp});
      insertAfterNum = null;
      if(!ok) await handleSaveFailure(()=>insertProblemAfter(par, afterNumSnapshot, {text, answer, solutionText, solutionImages, images, wideImages, followUp}));
    } else {
      const nums = problemsForPar(par);
      const num = nums.length ? Math.max(...nums)+1 : 1;
      const key = pKey(par,num);
      let ok = await saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp});
      if(!ok) await handleSaveFailure(()=>saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp}));
    }
    await renderProblemsTab();
    renderSidebar();
  } finally {
    addProblemBusy = false;
    // btn может уже не существовать в DOM после renderProblemsTab() — это ок, просто пропускаем
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

const saveProblemBusy = {}; // key -> true, пока запрос в процессе

async function saveProblemEdit(key, btn){
  if(saveProblemBusy[key]) return; // защита от двойного клика
  const text = document.getElementById('text-'+key).value.trim();
  const answer = document.getElementById('answer-'+key).value.trim();
  const solutionText = document.getElementById('solution-'+key).value.trim();
  const solutionImages = teacherDrafts[key] ? (teacherDrafts[key].solutionImages||[]) : [];
  const images = teacherDrafts[key] ? teacherDrafts[key].images : [];
  const wideImages = teacherDrafts[key] ? teacherDrafts[key].wideImages : [];
  const followUp = followUpFromForm(key);

  // Защита от случайной потери эталонного ответа: update_question удаляет
  // строку answer_key целиком, если и ответ, и решение пусты (см. addon6 —
  // так поддерживаются составные задачи без ответа, но у этой же логики
  // есть побочный эффект). Если до этой правки у задачи БЫЛ ответ/решение
  // (по данным teacherAnswerKeyCache), а сейчас оба поля пусты — почти
  // всегда это значит, что поля просто не успели загрузиться (как было при
  // прежнем баге с пагинацией), а не осознанное решение стереть ответ.
  const [par, num] = key.split('-').map(Number);
  const prevAk = teacherAnswerKeyCache[dbId(par, num)];
  const hadAnswerBefore = !!(prevAk && ((prevAk.answer && prevAk.answer.trim()) || (prevAk.solutionText && prevAk.solutionText.trim()) || (prevAk.solutionImages && prevAk.solutionImages.length)));
  const willBeEmpty = !answer && !solutionText && !(solutionImages && solutionImages.length);
  if(hadAnswerBefore && willBeEmpty){
    const proceed = await customConfirm('У задачи '+taskLabel(par,num)+' сейчас пусты и «Правильный ответ», и «Решение» — сохранение УДАЛИТ ранее сохранённый эталонный ответ/решение из базы.\nЭто обычно означает, что поле просто не успело загрузиться. Всё равно сохранить и удалить ответ?');
    if(!proceed) return;
  }

  saveProblemBusy[key] = true;
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  try{
    let ok = await saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp});
    if(!ok){ ok = await handleSaveFailure(()=>saveProblem(key, {text, answer, solutionText, solutionImages, images, wideImages, followUp})); }
    if(ok) await customAlert('Сохранено');
  } finally {
    saveProblemBusy[key] = false;
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

async function deleteProblem(key, btn){
  if(!await customConfirm('Удалить задачу '+taskLabel(...key.split('-').map(Number))+'? Результат по ней будет удалён у всех учеников, а номера последующих задач параграфа сдвинутся на 1.')) return;
  if(btn){ btn.disabled = true; btn.textContent = 'Удаляем...'; }
  let ok = await deleteProblemStorage(key);
  if(!ok) ok = await handleSaveFailure(()=>deleteProblemStorage(key));
  await renderProblemsTab();
  renderSidebar();
}

/* ---------- INSERT AFTER (renумерация — теперь один запрос на параграф) ---------- */
async function insertProblemAfter(par, afterNum, newContent){
  const btn = document.querySelector('#add-form .btn-dark');
  if(btn){ btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  const hasFollowUp = !!newContent.followUp;
  const { error } = await sbRpc('add_question', {
    p_password_hash: state.teacherPasswordHash,
    p_par: par,
    p_num: afterNum + 1,
    p_text: newContent.text || '',
    p_images: newContent.images || [],
    p_wide_images: newContent.wideImages || [],
    p_has_follow_up: hasFollowUp,
    p_follow_up_text: hasFollowUp ? (newContent.followUp.text||'') : null,
    p_follow_up_images: hasFollowUp ? (newContent.followUp.images||[]) : [],
    p_follow_up_wide_images: hasFollowUp ? (newContent.followUp.wideImages||[]) : [],
    p_answer: newContent.answer || '',
    p_follow_up_answer: hasFollowUp ? (newContent.followUp.answer||'') : null,
    p_solution_text: newContent.solutionText || null,
    p_solution_images: newContent.solutionImages || [],
    p_follow_up_solution_text: hasFollowUp ? (newContent.followUp.solutionText||null) : null,
    p_follow_up_solution_images: hasFollowUp ? (newContent.followUp.solutionImages||[]) : []
  });
  if(error){ lastStorageError = error; return false; }
  await ensureParLoaded(par, true);
  await loadTeacherAnswerKey();
  return true;
}

let resultsCache = null;
let answerKeyCache = {}; // "par.num" -> {answer, followUpAnswer}
let attemptsCache = {};  // studentName -> "par-num"(-followup) -> [{answer, is_correct, attempt_number}] (по возрастанию попыток)

async function renderResultsTab(){
  const body = document.getElementById('tm-body');
  body.innerHTML = `<p>Загрузка результатов...</p>`;

  const [{ data: summary, error: sErr }, { data: keyRows, error: kErr }, { data: attemptRows, error: atErr }] = await Promise.all([
    sbRpcAll('get_teacher_summary', { p_password_hash: state.teacherPasswordHash }),
    sbRpcAll('get_teacher_answer_key', { p_password_hash: state.teacherPasswordHash }),
    sbRpcAll('get_teacher_attempts', { p_password_hash: state.teacherPasswordHash })
  ]);

  if(sErr || kErr || atErr){
    body.innerHTML = `<p>Не удалось загрузить результаты. Попробуйте «Обновить данные».</p>`;
    return;
  }

  // Полная история попыток по каждой задаче (в отличие от get_teacher_summary/
  // progress, которая хранит только ПОСЛЕДНИЙ ответ) — нужна для колонки
  // "Ответы ученика" в таблице результатов (все попытки через "; ").
  attemptsCache = {};
  (attemptRows||[]).forEach(a=>{
    const baseKey = dbIdToKey(a.question_id);
    const key = a.is_follow_up ? followUpDataKey(baseKey) : baseKey;
    if(!attemptsCache[a.student_name]) attemptsCache[a.student_name] = {};
    if(!attemptsCache[a.student_name][key]) attemptsCache[a.student_name][key] = [];
    attemptsCache[a.student_name][key].push({ answer: a.answer, is_correct: a.is_correct, attempt_number: a.attempt_number });
  });
  Object.keys(attemptsCache).forEach(name=>{
    Object.keys(attemptsCache[name]).forEach(k=>{
      attemptsCache[name][k].sort((x,y)=>x.attempt_number - y.attempt_number);
    });
  });

  answerKeyCache = {};
  (keyRows||[]).forEach(r=>{ answerKeyCache[r.question_id] = { answer: r.answer, followUpAnswer: r.follow_up_answer, solutionText: r.solution_text, followUpSolutionText: r.follow_up_solution_text, solutionImages: r.solution_images || [], followUpSolutionImages: r.follow_up_solution_images || [] }; });

  const list = [];
  const allData = {};
  (summary||[]).forEach(row=>{
    if(!allData[row.student_name]){ allData[row.student_name] = {}; list.push(row.student_name); }
    const baseKey = dbIdToKey(row.question_id);
    const key = row.is_follow_up ? followUpDataKey(baseKey) : baseKey;
    allData[row.student_name][key] = {
      given: row.last_answer || '',
      correct: !!row.last_correct,
      ts: row.last_timestamp ? new Date(row.last_timestamp).getTime() : Date.now(),
      attempts: row.attempts || 0
    };
  });
  list.sort((a,b)=>a.localeCompare(b));

  resultsViewMode = 'table';
  resultsCache = { list, allData };
  // Сводная таблица "Все ученики" (имя + время последнего ответа) не
  // обращается к текстам задач вообще — открывается сразу, без похода за
  // параграфами в Supabase. Параграфы конкретного ученика подгружаются
  // только когда учитель выбирает его в списке — см. onStudentFilterChange.
  drawResults('__all__');
}

let resultsViewMode = 'table'; // 'table' | 'map' — карта по параграфам доступна только для конкретного ученика

/* Параграфы, которые понадобятся для полной таблицы конкретного ученика —
   только те, где у НЕГО есть хоть один ответ (а не все параграфы вообще). */
function parsNeededForStudent(name){
  const data = (resultsCache && resultsCache.allData[name]) || {};
  const pars = new Set();
  Object.keys(data).forEach(key=>{
    const baseKey = key.endsWith('-followup') ? key.slice(0, -('-followup'.length)) : key;
    pars.add(Number(baseKey.split('-')[0]));
  });
  return Array.from(pars);
}

async function onStudentFilterChange(name){
  if(name === '__all__'){ drawResults('__all__'); return; }
  const body = document.getElementById('tm-body');
  if(resultsViewMode === 'map'){
    if(!state.parBlobsLoaded){ await loadAllParBlobs(false, (done,total)=>{ body.innerHTML = `<p>Загрузка карты задач... ${done} из ${total}</p>`; }); }
  } else {
    const missing = parsNeededForStudent(name).filter(p=>!parLoaded[p]);
    if(missing.length){
      body.innerHTML = `<p>Загрузка результатов...</p>`;
      await loadParsSequentially(missing, false, (done,total)=>{ body.innerHTML = `<p>Загрузка результатов... ${done} из ${total}</p>`; });
    }
  }
  drawResults(name);
}

/* Клик по строке ученика в сводной таблице ("Все ученики") — то же самое,
   что выбрать его в выпадающем списке. */
function selectStudentFromSummary(name){
  const sel = document.getElementById('student-filter');
  if(sel) sel.value = name;
  onStudentFilterChange(name);
}

async function toggleResultsView(){
  const selectedStudent = document.getElementById('student-filter') ? document.getElementById('student-filter').value : '__all__';
  if(resultsViewMode === 'table'){
    const body = document.getElementById('tm-body');
    body.innerHTML = `<p>Загрузка карты задач...</p>`;
    await loadAllParBlobs(false, (done,total)=>{ body.innerHTML = `<p>Загрузка карты задач... ${done} из ${total}</p>`; }); // нужно знать полный список задач каждого параграфа, не только отвеченные
    resultsViewMode = 'map';
  } else {
    resultsViewMode = 'table';
  }
  drawResults(selectedStudent);
}

/* Статус конкретной задачи для карты ученика: та же логика цвета, что в
   кружках сайдбара (chipHtml), но по переданным данным конкретного ученика,
   а не по state.studentData текущего вошедшего профиля. */
function studentChipStatus(data, par, num){
  const rec = data[pKey(par, num)];
  if(!rec) return 'unsolved';
  return rec.correct ? ((rec.attempts>1) ? 'retry' : 'correct') : 'wrong';
}

function renderStudentMapHtml(name){
  const data = (resultsCache && resultsCache.allData[name]) || {};
  return `
    <div class="stu-map-legend">
      <span><i style="background:var(--green); border-color:var(--green);"></i>Верно с 1-й попытки</span>
      <span><i style="background:var(--amber); border-color:var(--amber);"></i>Верно не с 1-й попытки</span>
      <span><i style="background:var(--red); border-color:var(--red);"></i>Сейчас неверно</span>
      <span><i style="background:var(--surface);"></i>Не решено</span>
    </div>
    ${CURRICULUM.map(sec=>{
      const skipSubHeader = sec.subs.length === 1 && sec.subs[0].name === sectionBareName(sec.section);
      return `
      <div class="stu-map-sec">
        <div class="stu-map-sec-title">${escapeHtml(sec.section)}</div>
        ${sec.subs.map(sub=>`
          <div class="stu-map-sub">
            ${skipSubHeader ? '' : `<div class="stu-map-sub-title">${escapeHtml(sub.name)}</div>`}
            ${sub.pars.map(p=>{
              const nums = problemsForPar(p.num);
              if(!nums.length) return '';
              return `
              <div class="stu-map-par">
                <span class="stu-map-par-label">§${p.num}</span>
                <div class="stu-map-chips">
                  ${nums.map(n=>{
                    const st = studentChipStatus(data, p.num, n);
                    const key = pKey(p.num, n);
                    const rec = data[key];
                    const fuRec = data[followUpDataKey(key)];
                    const prob = (getParBlob(p.num) || {})[n];
                    const hasFollowUp = !!(prob && prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
                    const everWrongOnMain = !!(rec && (!rec.correct || rec.attempts > 1));
                    const followUpPending = hasFollowUp && everWrongOnMain && !(fuRec && fuRec.correct);
                    return `<span class="chip ${st==='unsolved'?'unsolved':st} ${followUpPending?'followup-pending':''}" style="cursor:pointer;" title="Задача ${taskLabel(p.num,n)}${followUpPending?' — есть нерешённая доп. задача':''} — нажмите, чтобы посмотреть текст" onclick="showProblemPreview(${p.num},${n},'${escapeAttr(name)}')">${taskLabel(p.num,n)}</span>`;
                  }).join('')}
                </div>
              </div>`;
            }).join('')}
          </div>
        `).join('')}
      </div>
    `;
    }).join('')}
  `;
}

let resultsSort = { field: 'ts', dir: 'desc' };

function setResultsSort(field){
  if(resultsSort.field === field){
    resultsSort.dir = resultsSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    resultsSort.field = field;
    resultsSort.dir = 'asc';
  }
  drawResults(document.getElementById('student-filter') ? document.getElementById('student-filter').value : '__all__');
}

function sortArrow(field){
  if(resultsSort.field !== field) return '<span style="opacity:.3;">↕</span>';
  return resultsSort.dir === 'asc' ? '↑' : '↓';
}

/* Все попытки ученика по конкретной задаче (или доп. задаче — dataKey с
   суффиксом "-followup") через "; ", в порядке попыток. Верная попытка —
   зелёным жирным, остальные — обычным текстом. Источник — attemptsCache
   (см. renderResultsTab), которая, в отличие от значений из "progress",
   хранит ВСЮ историю попыток, а не только последнюю. */
function answersListHtml(studentName, dataKey){
  const arr = (attemptsCache[studentName] && attemptsCache[studentName][dataKey]) || [];
  if(!arr.length) return '';
  return arr.map(a => a.is_correct
    ? `<b style="color:var(--green);">${escapeHtml(a.answer)}</b>`
    : escapeHtml(a.answer)
  ).join('; ');
}

function drawResults(selectedStudent){
  const body = document.getElementById('tm-body');
  const { list, allData } = resultsCache;
  if(selectedStudent === '__all__') resultsViewMode = 'table'; // карта имеет смысл только для одного ученика

  const headerHtml = `
    <div class="row-2" style="margin-bottom:16px; align-items:end;">
      <div>
        <div class="field-label">Ученик</div>
        <select id="student-filter" onchange="onStudentFilterChange(this.value)">
          <option value="__all__" ${selectedStudent==='__all__'?'selected':''}>Все ученики (${list.length})</option>
          ${list.map(n=>`<option value="${escapeAttr(n)}" ${selectedStudent===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
        </select>
        ${selectedStudent==='__all__' ? `<div style="font-size:12.6px; color:var(--muted); margin-top:6px;">Выберите имя ученика — результаты по задачам покажутся здесь</div>` : ''}
      </div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn" onclick="renderResultsTab()">Обновить данные</button>
        <button type="button" class="btn btn-sm" onclick="exportFullData(this)">Экспорт JSON</button>
        ${selectedStudent!=='__all__' ? `<button type="button" class="btn btn-sm" onclick="toggleResultsView()">${resultsViewMode==='map'?'Показать таблицей':'Показать по параграфам'}</button>` : ''}
        ${selectedStudent!=='__all__' ? `<button type="button" class="btn btn-sm" style="color:var(--red);" onclick="deleteStudent('${escapeAttr(selectedStudent)}')">Удалить ученика</button>` : ''}
      </div>
    </div>
  `;

  /* ---------- "Все ученики": только сводка имя + время последнего ответа ---------- */
  if(selectedStudent === '__all__'){
    const summary = list.map(name=>{
      const data = allData[name] || {};
      let lastTs = 0;
      Object.keys(data).forEach(k=>{ if(data[k].ts > lastTs) lastTs = data[k].ts; });
      return { name, lastTs };
    }).sort((a,b)=> b.lastTs - a.lastTs); // недавние сверху

    body.innerHTML = headerHtml + `
    <table>
      <thead><tr><th>Ученик</th><th style="white-space:nowrap;">Последний ответ</th></tr></thead>
      <tbody>
        ${summary.length ? summary.map(s=>`
          <tr class="summary-row" onclick="selectStudentFromSummary('${escapeAttr(s.name)}')">
            <td>${escapeHtml(s.name)}</td>
            <td style="white-space:nowrap;">${s.lastTs ? new Date(s.lastTs).toLocaleString('ru-RU', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
          </tr>`).join('') : `<tr><td colspan="2" style="text-align:center; color:var(--muted); padding:24px;">Пока нет ответов</td></tr>`}
      </tbody>
    </table>
    `;
    return;
  }

  /* ---------- Конкретный ученик: полная таблица по задачам ---------- */
  let rows = [];
  const data = allData[selectedStudent] || {};
  Object.keys(data).forEach(key=>{
    const isFollowUp = key.endsWith('-followup');
    const baseKey = isFollowUp ? key.slice(0, -('-followup'.length)) : key;
    const [par, num] = baseKey.split('-').map(Number);
    const meta = PAR_INDEX[par];
    const ak = answerKeyCache[dbId(par, num)];
    const correctAnswer = isFollowUp ? (ak ? ak.followUpAnswer : '') : (ak ? ak.answer : '');
    let followUpPending = false;
    if(!isFollowUp){
      const prob = (getParBlob(par) || {})[num];
      const hasFollowUp = !!(prob && prob.followUp && ((prob.followUp.text && prob.followUp.text.trim()) || (prob.followUp.images && prob.followUp.images.length) || (prob.followUp.wideImages && prob.followUp.wideImages.length)));
      const rec = data[key];
      const fuRec = data[followUpDataKey(key)];
      const everWrongOnMain = !!(rec && (!rec.correct || rec.attempts > 1));
      followUpPending = hasFollowUp && everWrongOnMain && !(fuRec && fuRec.correct);
    }
    rows.push({ name: selectedStudent, key: baseKey, dataKey: key, par, num, isFollowUp, title: meta ? meta.title : '', correctAnswer, followUpPending, ...data[key] });
  });

  const dirMul = resultsSort.dir === 'asc' ? 1 : -1;
  if(resultsSort.field === 'task'){
    rows.sort((a,b)=> dirMul * ((a.par - b.par) || (a.num - b.num)));
  } else {
    rows.sort((a,b)=> dirMul * (a.ts - b.ts));
  }

  body.innerHTML = headerHtml + `
    ${resultsViewMode==='map' ? renderStudentMapHtml(selectedStudent) : `
    <table>
      <thead><tr>
        <th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="setResultsSort('task')">№ задачи ${sortArrow('task')}</th><th>Результат</th><th>Попыток</th><th style="cursor:pointer; user-select:none; white-space:nowrap;" onclick="setResultsSort('ts')">Когда ${sortArrow('ts')}</th><th>Правильный ответ</th><th>Ответы ученика</th>
      </tr></thead>
      <tbody>
        ${rows.length ? rows.map(r=>`
          <tr>
            <td class="mono" style="cursor:pointer; color:var(--blue); white-space:nowrap;" title="Показать текст задачи" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">№${taskLabel(r.par,r.num)}${r.isFollowUp ? ` <span style="color:var(--blue); font-weight:600;">(доп.)</span>` : ''}</td>
            <td><span class="tag ${r.correct?((r.attempts>1)?'retry':'ok'):'bad'} ${r.followUpPending?'result-task-pending':''}" style="cursor:pointer;" title="Показать текст задачи${r.followUpPending?' — есть нерешённая доп. задача':''}" onclick="showProblemPreview(${r.par},${r.num},'${escapeAttr(r.name)}')">${r.correct?'Верно':'Неверно'}</span></td>
            <td class="mono">${r.attempts}</td>
            <td style="white-space:nowrap;">${new Date(r.ts).toLocaleString('ru-RU')}</td>
            <td class="mono">${escapeHtml(r.correctAnswer)}</td>
            <td class="mono">${answersListHtml(r.name, r.dataKey) || escapeHtml(r.given)}</td>
          </tr>`).join('') : `<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">Пока нет ответов</td></tr>`}
      </tbody>
    </table>
    `}
  `;
}

async function deleteStudent(name){
  if(!await customConfirm('Удалить ученика "'+name+'" вместе со всеми его результатами? Это действие необратимо.')) return;
  const { error } = await sbRpc('reset_student_progress', { p_password_hash: state.teacherPasswordHash, p_student_name: name });
  if(error){ await customAlert('Не удалось удалить ученика.'); return; }
  delete resultsCache.allData[name];
  resultsCache.list = resultsCache.list.filter(n=>n!==name);
  delete attemptsCache[name];
  drawResults('__all__');
}

/* Выгрузка полного JSON: вся база задач (со всеми параграфами, картинками,
   доп. задачами и эталонными ответами) + все результаты учеников — в одном
   файле. Задачи догружаются полностью (loadAllParBlobs), даже если учитель
   ещё не открывал часть параграфов в этой сессии. */
async function exportFullData(btn){
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; }
  try{
    if(btn) btn.textContent = 'Загружаем задачи...';
    await loadAllParBlobs(true, (done,total)=>{ if(btn) btn.textContent = `Загружаем задачи... ${done}/${total}`; });

    if(btn) btn.textContent = 'Загружаем ответы...';
    const { data: keyRows, error: kErr } = await sbRpcAll('get_teacher_answer_key', { p_password_hash: state.teacherPasswordHash });
    if(kErr){ await customAlert('Не удалось выгрузить эталонные ответы.'); return; }

    if(btn) btn.textContent = 'Загружаем результаты учеников...';
    const { data: summary, error: sErr } = await sbRpcAll('get_teacher_summary', { p_password_hash: state.teacherPasswordHash });
    if(sErr){ await customAlert('Не удалось выгрузить результаты учеников.'); return; }

    const answerMap = {};
    (keyRows||[]).forEach(r=>{ answerMap[r.question_id] = { answer: r.answer, followUpAnswer: r.follow_up_answer, solutionText: r.solution_text, followUpSolutionText: r.follow_up_solution_text, solutionImages: r.solution_images || [], followUpSolutionImages: r.follow_up_solution_images || [] }; });

    // ---- задачи ----
    const problems = [];
    for(let par=1; par<=TOTAL_PARS; par++){
      const blob = state.parBlobs[par] || {};
      Object.keys(blob).map(Number).sort((a,b)=>a-b).forEach(num=>{
        const id = dbId(par, num);
        const q = blob[num];
        const ak = answerMap[id] || {};
        const item = {
          par, num,
          text: q.text || '',
          images: q.images || [],
          wideImages: q.wideImages || [],
          answer: ak.answer ?? null,
          solution: ak.solutionText ?? null,
          solutionImages: ak.solutionImages || []
        };
        if(q.followUp){
          item.followUp = {
            text: q.followUp.text || '',
            images: q.followUp.images || [],
            wideImages: q.followUp.wideImages || [],
            answer: ak.followUpAnswer ?? null,
            solution: ak.followUpSolutionText ?? null,
            solutionImages: ak.followUpSolutionImages || []
          };
        }
        problems.push(item);
      });
    }

    // ---- результаты учеников ----
    const students = {};
    (summary||[]).forEach(row=>{
      if(!students[row.student_name]) students[row.student_name] = [];
      students[row.student_name].push({
        questionId: row.question_id,
        isFollowUp: row.is_follow_up,
        attempts: row.attempts,
        solved: row.solved,
        solvedOnAttempt: row.solved_on_attempt,
        lastAnswer: row.last_answer,
        lastCorrect: row.last_correct,
        lastTimestamp: row.last_timestamp
      });
    });

    const exportObj = {
      exportedAt: new Date().toISOString(),
      parTitles: parTitleOverrides,
      problems,
      students
    };

    const fileBlob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(fileBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `math_ege_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } finally {
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

function openReferenceMaterials(){
  const overlay = document.getElementById('reference-overlay');
  const body = document.getElementById('reference-body');
  body.innerHTML = referencePageHtml('left') + referencePageHtml('right');
  overlay.classList.add('open');
}

function closeReferenceMaterials(){
  document.getElementById('reference-overlay').classList.remove('open');
}

function referencePageHtml(side){
  const rec = REFERENCE_MATERIALS[side];
  const hasImages = rec && rec.type === 'image' && rec.images && rec.images.length;
  const hasText = rec && rec.type === 'text' && rec.text && rec.text.trim();
  if(!hasImages && !hasText){
    return `<div class="ref-page"><div class="placeholder-text">Материалы для этой страницы ещё не добавлены.</div></div>`;
  }
  if(hasText){
    // {{TRIG_CIRCLE}} — служебный маркер внутри текста п.19 (formatMathText его не
    // трогает, т.к. фигурные скобки без распознанного префикса — просто текст),
    // после рендера подменяется на настоящую картинку тригонометрического круга.
    let renderedHtml = formatMathText(rec.text);
    renderedHtml = renderedHtml.split('TRIGCIRCLEMARKER').join(
      `<img src="${TRIG_CIRCLE_B64}" alt="Тригонометрический круг" style="max-width:98%; width:100%; display:block; margin:10px auto; border-radius:8px; border:1px solid var(--border);">`
    );
    return `<div class="ref-page"><div class="problem-text">${renderedHtml}</div></div>`;
  }
  return `<div class="ref-page">${rec.images.map(src=>`<img src="${src}" alt="Справочные материалы">`).join('')}</div>`;
}

/* Строка "Ответ ученика: ..." под соответствующей частью задачи (основной
   или дополнительной) — тот же визуальный язык (тег ok/retry/bad), что и в
   таблице результатов. rec — запись {given, correct, attempts} или null/undefined,
   если ученик эту часть ещё не решал. */
function studentAnswerLineHtml(rec){
  if(!rec) return '';
  const cls = rec.correct ? ((rec.attempts>1)?'retry':'ok') : 'bad';
  const label = rec.correct ? 'Верно' : 'Неверно';
  return `<div class="prev-answer">Ответ ученика: <b>${escapeHtml(rec.given)}</b> <span class="tag ${cls}">${label}</span>${rec.attempts?` · попыток: ${rec.attempts}`:''}</div>`;
}

  const titleEl = document.getElementById('problem-preview-title');
  const body = document.getElementById('problem-preview-body');
  titleEl.textContent = 'Задача ' + taskLabel(par, num) + (studentName ? ' — ' + studentName : '');
  body.innerHTML = `<p>Загрузка...</p>`;
  overlay.classList.add('open');

  await ensureParLoaded(par, false);
  const prob = (getParBlob(par) || {})[num];
  if(!prob){
    body.innerHTML = `<div class="placeholder-text">Не удалось найти эту задачу (возможно, она была удалена или перемещена).</div>`;
    return;
  }
  const meta = PAR_INDEX[par];
  const ak = teacherAnswerKeyCache[dbId(par, num)] || answerKeyCache[dbId(par, num)] || {};
  const studentData = (studentName && resultsCache && resultsCache.allData[studentName]) ? resultsCache.allData[studentName] : null;
  const baseKey = pKey(par, num);
  const studentMain = studentData ? studentData[baseKey] : null;
  const studentFollowUp = studentData ? studentData[followUpDataKey(baseKey)] : null;

  let html = `<div class="par-eyebrow">${escapeHtml(meta ? meta.title : '')}</div>`;
  html += problemPreviewPartHtml(prob, null);
  if(ak.answer){
    html += `<div class="prev-answer">Правильный ответ: <b>${escapeHtml(ak.answer)}</b></div>`;
  }
  html += solutionBoxHtml('Полное решение (видно только вам)', ak.solutionText, ak.solutionImages);
  if(studentName) html += studentAnswerLineHtml(studentMain);
  if(prob.followUp){
    html += problemPreviewPartHtml(prob.followUp, 'Дополнительная задача к ' + taskLabel(par, num));
    if(ak.followUpAnswer){
      html += `<div class="prev-answer">Правильный ответ (доп. задача): <b>${escapeHtml(ak.followUpAnswer)}</b></div>`;
    }
    html += solutionBoxHtml('Полное решение доп. задачи (видно только вам)', ak.followUpSolutionText, ak.followUpSolutionImages);
    if(studentName) html += studentAnswerLineHtml(studentFollowUp);
  }
  body.innerHTML = html;
}

function closeProblemPreview(){
  document.getElementById('problem-preview-overlay').classList.remove('open');
}
</script>
</body>
</html>
